<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Kick 3D: Penalty & Free Kick Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
            background: #000;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        .stat-box {
            background: rgba(0,0,0,0.65);
            padding: 8px 14px;
            border: 2px solid #fff;
            border-radius: 6px;
        }
        #message-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #aaa;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="stat-box">SCORE: <span id="score-val" style="color: #ff0;">0</span></div>
        <div class="stat-box">LEVEL: <span id="level-val" style="color: #0ff;">1</span></div>
        <div class="stat-box">LIVES: <span id="lives-val" style="color: #f33;">❤️❤️❤️</span></div>
    </div>

    <div id="message-overlay">GOAL!</div>
    <div id="controls-hint">SWIPE UP TO SHOOT (CURVE YOUR SWIPE TO BEND IT)</div>
</div>

<script>
// --- GAME STATE VARIABLES ---
let level = 1;
let score = 0;
let lives = 3;
let gameState = 'AIMING'; // AIMING, IN_FLIGHT, RESULT, GAME_OVER

// Three.js Scene Setup
let scene, camera, renderer;
let ballMesh, keeperMesh, goalFrame, stadiumGroup;
let wallDefenders = [];

// Physics State
let ball = {
    pos: new THREE.Vector3(0, 0.4, 12),
    vel: new THREE.Vector3(0, 0, 0),
    spin: 0,
    radius: 0.4
};

let keeper = {
    pos: new THREE.Vector3(0, 1, 0),
    targetX: 0,
    velX: 0,
    state: 'IDLE'
};

let wind = 0;
let dragPoints = [];
let isDragging = false;

// Initialize 3D Engine
function init3D() {
    const container = document.getElementById('canvas-container');

    // 1. Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a16);

    // 2. Camera (3D Third-Person Perspective behind the ball)
    camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 16);
    camera.lookAt(0, 1.5, 0);

    // 3. Renderer (Pixelated Voxel aesthetic styling)
    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 4. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Build 3D Pixel World
    buildPitch();
    buildGoal();
    buildGalleryCrowd();
    createBall();
    createKeeper();

    // Event Listeners for Touch/Mouse Swipe
    const el = renderer.domElement;
    el.addEventListener('mousedown', onDragStart);
    el.addEventListener('mousemove', onDragMove);
    el.addEventListener('mouseup', onDragEnd);

    el.addEventListener('touchstart', (e) => { e.preventDefault(); onDragStart(e.touches[0]); });
    el.addEventListener('touchmove', (e) => { e.preventDefault(); onDragMove(e.touches[0]); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); onDragEnd(); });

    window.addEventListener('resize', onWindowResize);

    initLevel();
    animate();
}

// --- 3D ENVIRONMENT CREATION (VOXEL PIXEL STYLE) ---
function createBlock(w, h, d, color) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshLambertMaterial({ color: color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

function buildPitch() {
    // Green Pitch Base
    const pitch = createBlock(30, 0.2, 40, 0x27ae60);
    pitch.position.set(0, -0.1, 0);
    scene.add(pitch);

    // Striped Grass Lines
    for (let i = -18; i < 20; i += 4) {
        const stripe = createBlock(30, 0.22, 2, 0x219653);
        stripe.position.set(0, -0.09, i);
        scene.add(stripe);
    }
}

function buildGoal() {
    goalFrame = new THREE.Group();

    const postMatColor = 0xffffff;
    // Left & Right Posts
    const leftPost = createBlock(0.2, 2.5, 0.2, postMatColor);
    leftPost.position.set(-3.5, 1.25, 0);
    const rightPost = createBlock(0.2, 2.5, 0.2, postMatColor);
    rightPost.position.set(3.5, 1.25, 0);

    // Crossbar
    const crossbar = createBlock(7.2, 0.2, 0.2, postMatColor);
    crossbar.position.set(0, 2.5, 0);

    // Pixel Net
    const net = createBlock(7, 2.4, 0.1, 0xaaaaaa);
    net.position.set(0, 1.2, -1.2);
    net.material.transparent = true;
    net.material.opacity = 0.3;

    goalFrame.add(leftPost, rightPost, crossbar, net);
    scene.add(goalFrame);
}

function buildGalleryCrowd() {
    stadiumGroup = new THREE.Group();
    
    // Stadium Stand Structure behind the goal
    const stand = createBlock(36, 10, 8, 0x1a1a24);
    stand.position.set(0, 5, -6);
    stadiumGroup.add(stand);

    // Colorful 3D Voxel Crowd
    const colors = [0xe74c3c, 0x3498db, 0xf1c40f, 0x2ecc71, 0x9b59b6, 0xffffff];
    for (let x = -16; x < 16; x += 1.2) {
        for (let y = 2; y < 9; y += 1.4) {
            const spectator = createBlock(0.8, 0.8, 0.8, colors[Math.floor(Math.random() * colors.length)]);
            spectator.position.set(x, y, -2 - (y * 0.4));
            stadiumGroup.add(spectator);
        }
    }
    scene.add(stadiumGroup);
}

function createBall() {
    const geo = new THREE.DodecahedronGeometry(ball.radius, 1);
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
    ballMesh = new THREE.Mesh(geo, mat);
    ballMesh.castShadow = true;
    scene.add(ballMesh);
}

function createKeeper() {
    keeperMesh = new THREE.Group();

    // Body Block
    const body = createBlock(1.0, 1.4, 0.6, 0x9b59b6);
    body.position.set(0, 0.7, 0);

    // Head Block
    const head = createBlock(0.6, 0.6, 0.6, 0xf1c40f);
    head.position.set(0, 1.7, 0);

    // Gloves
    const leftGlove = createBlock(0.4, 0.4, 0.4, 0xe74c3c);
    leftGlove.position.set(-0.7, 0.8, 0.2);
    const rightGlove = createBlock(0.4, 0.4, 0.4, 0xe74c3c);
    rightGlove.position.set(0.7, 0.8, 0.2);

    keeperMesh.add(body, head, leftGlove, rightGlove);
    scene.add(keeperMesh);
}

function setupWall() {
    // Clear old wall
    wallDefenders.forEach(d => scene.remove(d.mesh));
    wallDefenders = [];

    const count = Math.min(2 + Math.floor(level / 3), 5);
    const startX = -((count - 1) * 0.9) / 2;

    for (let i = 0; i < count; i++) {
        const defenderMesh = new THREE.Group();
        const body = createBlock(0.8, 1.6, 0.5, 0xe67e22);
        body.position.set(0, 0.8, 0);
        const head = createBlock(0.5, 0.5, 0.5, 0xf39c12);
        head.position.set(0, 1.85, 0);
        defenderMesh.add(body, head);

        const xPos = startX + i * 0.9;
        const zPos = 6; // Midway between ball & goal
        defenderMesh.position.set(xPos, 0, zPos);

        scene.add(defenderMesh);
        wallDefenders.push({ mesh: defenderMesh, x: xPos, z: zPos, isJumping: false, velY: 0 });
    }
}

// --- LEVEL SETUP ---
function initLevel() {
    ball.pos.set(0, 0.4, 12);
    ball.vel.set(0, 0, 0);
    ball.spin = 0;
    ballMesh.position.copy(ball.pos);

    keeper.pos.set(0, 0, 0);
    keeper.state = 'IDLE';
    keeperMesh.position.copy(keeper.pos);

    if (level >= 3) {
        setupWall();
    } else {
        wallDefenders.forEach(d => scene.remove(d.mesh));
        wallDefenders = [];
    }

    wind = (level >= 5) ? (Math.random() - 0.5) * (level * 0.03) : 0;
    gameState = 'AIMING';
}

// --- SWIPE CONTROLS ---
function onDragStart(e) {
    if (gameState !== 'AIMING') return;
    isDragging = true;
    dragPoints = [{ x: e.clientX, y: e.clientY, time: Date.now() }];
}

function onDragMove(e) {
    if (!isDragging || gameState !== 'AIMING') return;
    dragPoints.push({ x: e.clientX, y: e.clientY, time: Date.now() });
    if (dragPoints.length > 8) dragPoints.shift();
}

function onDragEnd() {
    if (!isDragging || gameState !== 'AIMING') return;
    isDragging = false;

    if (dragPoints.length >= 2) {
        const start = dragPoints[0];
        const end = dragPoints[dragPoints.length - 1];

        const dx = end.x - start.x;
        const dy = end.y - start.y;

        if (dy < -30) { // Forward swipe
            const forwardSpeed = Math.min(Math.abs(dy) * 0.08, 22);
            const sideSpeed = dx * 0.025;
            const upwardSpeed = Math.min(Math.abs(dy) * 0.04, 8);

            // Curve calculation from swipe path trajectory
            const mid = dragPoints[Math.floor(dragPoints.length / 2)];
            const curve = (mid.x - (start.x + end.x) / 2);

            ball.vel.set(sideSpeed, upwardSpeed, -forwardSpeed);
            ball.spin = -curve * 0.005;

            // Trigger AI & Wall Jump
            triggerKeeperAI();
            wallDefenders.forEach(d => {
                if (Math.random() > 0.3) d.isJumping = true;
            });

            gameState = 'IN_FLIGHT';
        }
    }
}

// --- AI & PHYSICS LOOP ---
function triggerKeeperAI() {
    const reactionDelay = Math.max(80, 450 - level * 30);
    setTimeout(() => {
        // Predict ball trajectory at goal line (Z = 0)
        let predictedX = ball.pos.x + (ball.vel.x * 0.8) + (ball.spin * 12);
        if (level < 5) predictedX += (Math.random() - 0.5) * 3;

        keeper.targetX = THREE.MathUtils.clamp(predictedX, -3.2, 3.2);
        keeper.state = 'DIVING';
    }, reactionDelay);
}

function updatePhysics(delta) {
    if (gameState !== 'IN_FLIGHT') return;

    // Apply Ball Forces (Vel, Gravity, Curve/Spin, Wind)
    ball.vel.x += (ball.spin + wind) * delta * 60;
    ball.vel.y -= 9.8 * delta; // Gravity
    ball.pos.addScaledVector(ball.vel, delta);

    // Floor Bounce
    if (ball.pos.y <= ball.radius) {
        ball.pos.y = ball.radius;
        ball.vel.y *= -0.5;
        ball.vel.x *= 0.7;
        ball.vel.z *= 0.7;
    }

    ballMesh.position.copy(ball.pos);
    ballMesh.rotation.x += ball.vel.z * delta;

    // Goalkeeper AI Movement
    if (keeper.state === 'DIVING') {
        const speed = (5 + level * 0.5) * delta;
        if (Math.abs(keeper.pos.x - keeper.targetX) > 0.1) {
            keeper.pos.x += Math.sign(keeper.targetX - keeper.pos.x) * speed;
        }
        keeperMesh.position.copy(keeper.pos);
    }

    // Wall Defender Jump Movement
    wallDefenders.forEach(d => {
        if (d.isJumping) {
            d.mesh.position.y += 3 * delta;
            if (d.mesh.position.y >= 1.2) d.isJumping = false;
        } else if (d.mesh.position.y > 0) {
            d.mesh.position.y -= 3 * delta;
        }
    });

    // --- COLLISIONS ---
    // 1. Wall Hit
    wallDefenders.forEach(d => {
        if (Math.abs(ball.pos.z - d.z) < 0.4 && Math.abs(ball.pos.x - d.mesh.position.x) < 0.5) {
            if (ball.pos.y < 1.8 + d.mesh.position.y) {
                ball.vel.z *= -0.3;
                triggerResult("BLOCKED BY WALL!");
            }
        }
    });

    // 2. Goalkeeper Save Hit
    if (Math.abs(ball.pos.z - keeper.pos.z) < 0.5 && Math.abs(ball.pos.x - keeper.pos.x) < 0.9) {
        if (ball.pos.y < 2.2) {
            ball.vel.z *= -0.4;
            ball.vel.x += (Math.random() - 0.5) * 5;
            triggerResult("SAVED!");
        }
    }

    // 3. Goal / Out Collision
    if (ball.pos.z <= 0) {
        const inGoalX = Math.abs(ball.pos.x) < 3.4;
        const inGoalY = ball.pos.y < 2.4 && ball.pos.y > 0.2;

        if (inGoalX && inGoalY) {
            const isCorner = Math.abs(ball.pos.x) > 2.2 && ball.pos.y > 1.6;
            const pts = isCorner ? 250 : 100;
            score += pts;
            level++;
            triggerResult(isCorner ? "UPPER 90! +250" : "GOAL! +100", true);
        } else {
            triggerResult("OUT!");
        }
    }
}

function triggerResult(text, isGoal = false) {
    if (gameState === 'RESULT') return;
    gameState = 'RESULT';

    const msgEl = document.getElementById('message-overlay');
    msgEl.innerText = text;
    msgEl.style.color = isGoal ? '#0f0' : '#f33';
    msgEl.style.opacity = 1;

    if (!isGoal) {
        lives--;
        if (lives <= 0) {
            setTimeout(() => {
                msgEl.innerText = "GAME OVER\nClick to Restart";
                gameState = 'GAME_OVER';
            }, 1000);
            return;
        }
    }

    updateUI();

    setTimeout(() => {
        msgEl.style.opacity = 0;
        initLevel();
    }, 1800);
}

function updateUI() {
    document.getElementById('score-val').innerText = score;
    document.getElementById('level-val').innerText = level;
    document.getElementById('lives-val').innerText = "❤️".repeat(Math.max(0, lives));
}

// Restart Handler
window.addEventListener('click', () => {
    if (gameState === 'GAME_OVER') {
        score = 0;
        level = 1;
        lives = 3;
        document.getElementById('message-overlay').style.opacity = 0;
        updateUI();
        initLevel();
    }
});

function onWindowResize() {
    const container = document.getElementById('canvas-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}

// --- RENDER & ANIMATION LOOP ---
let clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    updatePhysics(delta);

    // Subtle Gallery Crowd Bounce Animation
    if (stadiumGroup) {
        stadiumGroup.position.y = Math.sin(Date.now() * 0.005) * 0.1;
    }

    renderer.render(scene, camera);
}

// Start
init3D();
</script>
</body>
</html>
