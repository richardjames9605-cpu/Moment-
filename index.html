<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Kick: Retro Penalty & Free Kick</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }
        .stat-box {
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border: 2px solid #fff;
            border-radius: 4px;
        }
        #message-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #aaa;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    
    <div id="ui-overlay">
        <div class="stat-box">SCORE: <span id="score-val" style="color: #ff0;">0</span></div>
        <div class="stat-box">LEVEL: <span id="level-val" style="color: #0ff;">1</span></div>
        <div class="stat-box">LIVES: <span id="lives-val" style="color: #f33;">❤️❤️❤️</span></div>
    </div>

    <div id="message-overlay">GOAL!</div>
    <div id="controls-hint">DRAG & RELEASE TO SHOOT (SWIPE CURVED TO BEND IT)</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let level = 1;
let score = 0;
let lives = 3;
let gameState = 'AIMING'; // AIMING, IN_FLIGHT, RESULT, GAME_OVER
let messageTimer = 0;
let mode = 'PENALTY'; // PENALTY or FREEKICK

// Stadium Elements
const goal = { x: 100, y: 120, w: 280, h: 100, depth: 30 };
const ballStart = { x: 240, y: 540 };

// Dynamic Objects
let ball = {
    x: ballStart.x,
    y: ballStart.y,
    z: 0, // Height off ground
    vx: 0,
    vy: 0,
    vz: 0,
    radius: 10,
    spin: 0
};

let keeper = {
    x: 240,
    y: goal.y + goal.h,
    w: 36,
    h: 48,
    vx: 0,
    state: 'IDLE', // IDLE, DIVING
    targetX: 240,
    targetY: goal.y + goal.h
};

let wallDefenders = [];
let wind = { x: 0, y: 0 };

// Touch / Mouse Tracking for Swipe
let dragStart = null;
let dragCurrent = null;
let pathPoints = [];

// --- INITIALIZATION ---
function initLevel() {
    ball.x = ballStart.x;
    ball.y = ballStart.y;
    ball.z = 0;
    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;
    ball.spin = 0;

    keeper.x = 240;
    keeper.y = goal.y + goal.h;
    keeper.vx = 0;
    keeper.state = 'IDLE';

    // Set Mode and Setup Mechanics based on Level
    if (level >= 3) {
        mode = 'FREEKICK';
        setupWall();
    } else {
        mode = 'PENALTY';
        wallDefenders = [];
    }

    // Dynamic Wind starting at level 5
    if (level >= 5) {
        wind.x = (Math.random() - 0.5) * (level * 0.4);
    } else {
        wind.x = 0;
    }

    gameState = 'AIMING';
}

function setupWall() {
    wallDefenders = [];
    const count = Math.min(2 + Math.floor(level / 3), 5);
    const startX = 240 - (count * 20) / 2;
    const wallY = 340; // Between ball and goal

    for (let i = 0; i < count; i++) {
        wallDefenders.push({
            x: startX + i * 22,
            y: wallY,
            w: 18,
            h: 42,
            offsetY: 0,
            isJumping: false
        });
    }
}

// --- INPUT HANDLERS ---
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', drag);
canvas.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drag(e); });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); endDrag(e); });

function startDrag(e) {
    if (gameState !== 'AIMING') return;
    const pos = getCanvasPos(e);
    // Only start drag near the ball
    if (Math.hypot(pos.x - ball.x, pos.y - ball.y) < 50) {
        dragStart = pos;
        pathPoints = [pos];
    }
}

function drag(e) {
    if (!dragStart || gameState !== 'AIMING') return;
    const pos = getCanvasPos(e);
    dragCurrent = pos;
    pathPoints.push(pos);
    if (pathPoints.length > 10) pathPoints.shift();
}

function endDrag(e) {
    if (!dragStart || gameState !== 'AIMING') return;
    
    if (pathPoints.length >= 2) {
        const first = pathPoints[0];
        const last = pathPoints[pathPoints.length - 1];
        
        const dx = last.x - first.x;
        const dy = last.y - first.y;

        if (dy < -20) { // Must swipe upwards
            const speed = Math.min(Math.hypot(dx, dy) * 0.12, 18);
            const angle = Math.atan2(dy, dx);

            ball.vx = Math.cos(angle) * speed;
            ball.vy = Math.sin(angle) * speed;
            ball.vz = Math.min(Math.abs(dy) * 0.08, 10); // Elevation physics

            // Calculate spin based on path curvature
            let mid = pathPoints[Math.floor(pathPoints.length / 2)];
            let curve = (mid.x - (first.x + last.x) / 2);
            ball.spin = curve * 0.15;

            // Trigger Goalkeeper AI Prediction
            triggerKeeperAI();

            // Wall Jump trigger
            wallDefenders.forEach(d => {
                if (Math.random() > 0.3) {
                    d.isJumping = true;
                }
            });

            gameState = 'IN_FLIGHT';
        }
    }

    dragStart = null;
    dragCurrent = null;
}

// --- AI & PHYSICS LOGIC ---
function triggerKeeperAI() {
    // Goalkeeper difficulty scales with level
    const reactionDelay = Math.max(100, 500 - level * 30);
    const speed = 3 + Math.min(level * 0.5, 7);

    setTimeout(() => {
        // Predict ball position at goal line
        let predictedX = ball.x + (ball.vx * 25) + (ball.spin * 10);
        // Add random error on early levels
        if (level < 5) {
            predictedX += (Math.random() - 0.5) * 80;
        }

        // Keep target inside or near goal frame
        keeper.targetX = Math.max(goal.x - 10, Math.min(goal.x + goal.w + 10, predictedX));
        keeper.vx = (keeper.targetX > keeper.x ? 1 : -1) * speed;
        keeper.state = 'DIVING';
    }, reactionDelay);
}

function updatePhysics() {
    if (gameState !== 'IN_FLIGHT') return;

    // Ball movement
    ball.x += ball.vx + wind.x;
    ball.y += ball.vy;
    ball.z += ball.vz;

    // Apply Spin & Gravity
    ball.vx += ball.spin * 0.08;
    ball.vz -= 0.38; // Gravity

    if (ball.z < 0) {
        ball.z = 0;
        ball.vx *= 0.6;
        ball.vy *= 0.6;
    }

    // Goalkeeper movement
    if (keeper.state === 'DIVING') {
        if (Math.abs(keeper.x - keeper.targetX) > 4) {
            keeper.x += keeper.vx;
        }
    }

    // Wall Defender Jump movement
    wallDefenders.forEach(d => {
        if (d.isJumping) {
            d.offsetY -= 2;
            if (d.offsetY < -25) d.isJumping = false;
        } else if (d.offsetY < 0) {
            d.offsetY += 2;
        }
    });

    // --- COLLISIONS ---

    // 1. Wall Collision
    wallDefenders.forEach(d => {
        if (ball.y <= d.y + 10 && ball.y >= d.y - 10) {
            if (ball.x >= d.x && ball.x <= d.x + d.w) {
                if (ball.z < d.h + d.offsetY) {
                    ball.vy = 2; // Bounce back
                    ball.vx *= -0.5;
                    triggerResult("BLOCKED BY WALL!");
                }
            }
        }
    });

    // 2. Goalkeeper Save Collision
    const kRect = {
        x: keeper.x - keeper.w / 2,
        y: keeper.y - keeper.h,
        w: keeper.w,
        h: keeper.h
    };

    if (ball.y <= keeper.y && ball.y >= keeper.y - 20) {
        if (ball.x >= kRect.x && ball.x <= kRect.x + kRect.w) {
            if (ball.z <= kRect.h) {
                ball.vy = 3;
                ball.vx = (Math.random() - 0.5) * 6;
                triggerResult("SAVED!");
            }
        }
    }

    // 3. Goal & Miss Detection
    if (ball.y <= goal.y + 10) {
        // Goal frame checks
        const insideX = ball.x > goal.x + 8 && ball.x < goal.x + goal.w - 8;
        const insideZ = ball.z < goal.h - 5;

        // Check Crossbar / Post Hits
        const hitPost = (Math.abs(ball.x - goal.x) < 8 || Math.abs(ball.x - (goal.x + goal.w)) < 8) && insideZ;
        const hitBar = insideX && Math.abs(ball.z - goal.h) < 8;

        if (hitPost || hitBar) {
            ball.vy = 4;
            ball.vz = -2;
            triggerResult("WOODWORK!");
            return;
        }

        if (insideX && insideZ) {
            // Check Upper 90 corner goal
            const isCorner = (ball.x < goal.x + 40 || ball.x > goal.x + goal.w - 40) && ball.z > goal.h - 30;
            const pts = isCorner ? 250 : 100;
            score += pts;
            level++;
            triggerResult(isCorner ? "UPPER 90! +250" : "GOAL! +100", true);
        } else {
            triggerResult("OUT!");
        }
    }
}

function triggerResult(text, isGoal = false) {
    if (gameState === 'RESULT') return;
    gameState = 'RESULT';

    const msgEl = document.getElementById('message-overlay');
    msgEl.innerText = text;
    msgEl.style.color = isGoal ? '#0f0' : '#f33';
    msgEl.style.opacity = 1;

    if (!isGoal) {
        lives--;
        if (lives <= 0) {
            setTimeout(() => {
                msgEl.innerText = "GAME OVER\nClick to Restart";
                gameState = 'GAME_OVER';
            }, 1000);
            return;
        }
    }

    updateUI();

    setTimeout(() => {
        msgEl.style.opacity = 0;
        initLevel();
    }, 1800);
}

function updateUI() {
    document.getElementById('score-val').innerText = score;
    document.getElementById('level-val').innerText = level;
    document.getElementById('lives-val').innerText = "❤️".repeat(Math.max(0, lives));
}

// Restart Game
canvas.addEventListener('click', () => {
    if (gameState === 'GAME_OVER') {
        score = 0;
        level = 1;
        lives = 3;
        document.getElementById('message-overlay').style.opacity = 0;
        updateUI();
        initLevel();
    }
});

// --- RENDER FUNCTIONS (PIXEL ART STYLE) ---
function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawStadium() {
    // Sky
    drawPixelRect(0, 0, canvas.width, 120, '#111d2b');

    // Cheering Gallery / Pixelated Crowd
    for (let x = 0; x < canvas.width; x += 8) {
        for (let y = 30; y < 110; y += 8) {
            const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#ffffff'];
            // Animated crowd color flickering
            const randomColor = colors[(Math.floor(x + y + Date.now() * 0.005) % colors.length)];
            drawPixelRect(x, y, 6, 6, randomColor);
        }
    }

    // Pitch Grass Patterns
    drawPixelRect(0, 110, canvas.width, canvas.height - 110, '#27ae60');
    for (let y = 110; y < canvas.height; y += 40) {
        if ((y / 40) % 2 === 0) {
            drawPixelRect(0, y, canvas.width, 20, '#219653');
        }
    }

    // Penalty Box Lines
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(goal.x - 40, goal.y, goal.w + 80, 260);

    // Goal Net Backing
    drawPixelRect(goal.x, goal.y, goal.w, goal.h, '#1e272c');
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    for (let x = goal.x; x <= goal.x + goal.w; x += 10) {
        ctx.beginPath();
        ctx.moveTo(x, goal.y);
        ctx.lineTo(x, goal.y + goal.h);
        ctx.stroke();
    }
    for (let y = goal.y; y <= goal.y + goal.h; y += 10) {
        ctx.beginPath();
        ctx.moveTo(goal.x, y);
        ctx.lineTo(goal.x + goal.w, y);
        ctx.stroke();
    }

    // Goal Frame (Posts & Crossbar)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
}

function drawWall() {
    wallDefenders.forEach(d => {
        const py = d.y + d.offsetY;
        // Jersey
        drawPixelRect(d.x, py, d.w, d.h - 14, '#e67e22');
        // Shorts & Legs
        drawPixelRect(d.x, py + d.h - 14, d.w, 8, '#2c3e50');
        drawPixelRect(d.x + 2, py + d.h - 6, 4, 6, '#f1c40f');
        drawPixelRect(d.x + d.w - 6, py + d.h - 6, 4, 6, '#f1c40f');
        // Head
        drawPixelRect(d.x + 3, py - 10, 12, 10, '#f39c12');
    });
}

function drawKeeper() {
    const kx = keeper.x - keeper.w / 2;
    const ky = keeper.y - keeper.h;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(keeper.x, keeper.y, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body (Pixel Goalkeeper)
    drawPixelRect(kx, ky, keeper.w, keeper.h - 16, '#9b59b6'); // Purple Jersey
    drawPixelRect(kx + 4, ky + keeper.h - 16, keeper.w - 8, 10, '#34495e'); // Shorts
    drawPixelRect(kx + 4, ky + keeper.h - 6, 8, 6, '#f1c40f'); // Socks
    drawPixelRect(kx + keeper.w - 12, ky + keeper.h - 6, 8, 6, '#f1c40f');

    // Head & Gloves
    drawPixelRect(kx + 10, ky - 12, 16, 12, '#f1c40f'); // Head
    drawPixelRect(kx - 6, ky + 8, 8, 8, '#e74c3c'); // Left Glove
    drawPixelRect(kx + keeper.w - 2, ky + 8, 8, 8, '#e74c3c'); // Right Glove
}

function drawBall() {
    // Ball Shadow (Scales with altitude z)
    const shadowScale = Math.max(0.3, 1 - ball.z * 0.015);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y, ball.radius * shadowScale, (ball.radius / 2) * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Render Ball elevated by z-axis
    const renderY = ball.y - ball.z;
    
    // Pixelated Ball Body
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, renderY, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Ball Pattern / Rotation simulation
    drawPixelRect(ball.x - 3, renderY - 3, 6, 6, '#000000');
}

function drawAimTrajectory() {
    if (dragStart && dragCurrent) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
        for (let p of pathPoints) {
            ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawWindIndicator() {
    if (Math.abs(wind.x) > 0.1) {
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier New';
        const dir = wind.x > 0 ? '--->' : '<---';
        ctx.fillText(`WIND: ${dir} ${Math.abs(wind.x).toFixed(1)}`, 20, 50);
    }
}

// --- MAIN GAME LOOP ---
function gameLoop() {
    // Update
    updatePhysics();

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStadium();
    drawWall();
    drawKeeper();
    drawBall();
    drawAimTrajectory();
    drawWindIndicator();

    requestAnimationFrame(gameLoop);
}

// Run
initLevel();
gameLoop();
</script>
</body>
</html>
